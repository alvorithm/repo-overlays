[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-overlays"
version = "0.1.0"
description = "Compose Markdown agent guidance into project worktrees without committing upstream"
requires-python = ">=3.11"
dependencies = [
    "inotify-simple",
    "tomli-w",
]

[project.scripts]
repo-overlay = "repo_overlays.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_overlays"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
